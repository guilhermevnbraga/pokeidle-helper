# Chromium numa tela virtual, com a extensão carregada, para rodar 24/7 num servidor.
# O consumo de CPU vem quase todo do jogo desenhando a cena: use o modo "ULTRA Economia" no painel da extensão.
services:
  chromium:
    image: lscr.io/linuxserver/chromium:latest
    container_name: pokeidle-chromium
    security_opt:
      - seccomp:unconfined          # exigido pelo Chromium dentro do Docker
    shm_size: "1gb"
    cpus: "1.5"                      # teto de CPU: evita esquentar o servidor
    mem_limit: 2g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - CUSTOM_USER=${WEB_USER:-pokeidle}
      - PASSWORD=${WEB_PASSWORD:?defina WEB_PASSWORD no arquivo .env}
      # --disable-gpu: o jogo usa canvas 2D, e sem GPU real o Chromium gasta menos CPU em renderização por software
      - CHROME_CLI=--load-extension=/extension --disable-extensions-except=/extension --disable-gpu --disable-smooth-scrolling --disable-background-networking --disable-component-update --disable-sync --disable-features=site-per-process,Translate,MediaRouter https://pokeidle.io/app
    volumes:
      - ./profile:/config            # perfil do navegador: o login do jogo fica salvo aqui
      - ../:/extension:ro            # esta pasta é a extensão
    ports:
      # interface web em HTTPS (certificado autoassinado). Por padrão só local; defina BIND_IP no .env
      # (ex.: o IP do CT) para acessar pela rede. Exponha fora de casa só por Cloudflare Tunnel ou Tailscale.
      - "${BIND_IP:-127.0.0.1}:3001:3001"
    restart: unless-stopped
