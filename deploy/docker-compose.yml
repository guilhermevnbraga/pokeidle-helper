# 1 único Chromium com até 4 perfis em TELA CHEIA + barra inferior (tint2) para trocar com 1 clique.
# Sem teto CFS duro no Docker (o próprio CT no Proxmox limita vCPUs), evitando travamentos ao digitar.
# Após o boot, minimiza as janelas automaticamente (GPU/compositor = 0% em repouso).
services:
  chromium:
    build: .
    image: pokeidle-chromium-multi:latest
    container_name: pokeidle-chromium
    security_opt:
      - seccomp:unconfined          # exigido pelo Chromium dentro do Docker
    shm_size: "512m"
    mem_limit: ${MEM_LIMIT:-2800m}  # com CT de 4 GB no Proxmox, pode subir para 3500m no .env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - CUSTOM_USER=${WEB_USER:-pokeidle}
      - PASSWORD=${WEB_PASSWORD:?defina WEB_PASSWORD no arquivo .env}
      # X11 (Openbox + tint2): janelas maximizadas na resolução da sua tela + minimização automática
      - PIXELFLUX_WAYLAND=false
      - POKEIDLE_PROFILES=${POKEIDLE_PROFILES:-Default,Conta2,Conta3,Conta4}
      - POKEIDLE_APP_MODE=${POKEIDLE_APP_MODE:-1}
      - POKEIDLE_V8_HEAP_MB=${POKEIDLE_V8_HEAP_MB:-320}
      - POKEIDLE_STAGGER_SEC=${POKEIDLE_STAGGER_SEC:-4}
      - POKEIDLE_AUTO_MINIMIZE=${POKEIDLE_AUTO_MINIMIZE:-1}
    volumes:
      - ./profile:/config                                    # perfis, logins e configs da extensão ficam salvos aqui
      - ./autostart.sh:/config/.config/openbox/autostart:ro  # abre os 4 perfis em tela cheia no mesmo Chromium
      - ./tint2rc:/config/tint2rc:ro                         # barra inferior para alternar/minimizar contas
      - ../:/extension:ro                                    # esta pasta é a extensão
      - ./server-flag.js:/extension/server-flag.js:ro        # ativa Modo Servidor + FPS 2 por padrão nas contas novas
    ports:
      # interface web em HTTPS (certificado autoassinado). Por padrão só local; defina BIND_IP no .env
      # (ex.: o IP do CT) para acessar pela rede. Exponha fora de casa só por Cloudflare Tunnel ou Tailscale.
      - "${BIND_IP:-127.0.0.1}:3001:3001"
    restart: unless-stopped
